document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

fo:var(--igs-blue);\n--status-success:#1D6357;\n--status-warning:#B07A18;\n--status-danger:#8B0000;     /* form error border used on the source site */\n}\n\n:root{\n/* Families. Montserrat stands in for Lulo Clean (display) and Gotham (text). */\n--font-display:'Montserrat',Futura,'Century Gothic',sans-serif;\n--font-sans:'Montserrat','Helvetica Neue',Arial,sans-serif;\n--font-body-alt:'Lato','Helvetica Neue',Arial,sans-serif;\n--font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;\n\n/* Weights */\n--fw-light:300; /* @kind font */\n--fw-regular:400; /* @kind font */\n--fw-medium:500; /* @kind font */\n--fw-semibold:600; /* @kind font */\n--fw-bold:700; /* @kind font */\n\n/* Display scale (source site: 60 / 50 / 46 / 36 / 30 px) */\n--fs-display-1:60px;\n--fs-display-2:50px;\n--fs-display-3:46px;\n--fs-h2:36px;\n--fs-h3:30px;\n--fs-h4:25px;\n--fs-h5:20px;\n\n/* Text scale (source site: 20 / 17 / 16 / 15 / 14 / 12 px) */\n--fs-body-lg:20px;\n--fs-body:17px;\n--fs-body-sm:16px;\n--fs-ui:15px;\n--fs-caption:14px;\n--fs-micro:12px;\n\n/* Line heights */\n--lh-display:0.9; /* @kind font */\n--lh-heading:1em;\n--lh-snug:1.4em;\n--lh-body:1.6em;\n\n/* Tracking. Display caps are widely tracked; this is the brand's loudest type signal. */\n--ls-display:0.15em;\n--ls-display-tight:0.06em;\n--ls-eyebrow:0.22em;\n--ls-normal:normal; /* @kind font */\n\n--tt-display:uppercase; /* @kind font */\n}\n\n:root{\n--space-0:0px;\n--space-1:4px;\n--space-2:8px;\n--space-3:12px;\n--space-4:16px;\n--space-5:24px;\n--space-6:32px;\n--space-7:48px;\n--space-8:64px;\n--space-9:96px;\n--space-10:128px;\n\n--section-py:96px;          /* vertical rhythm of a marketing section */\n--section-py-tight:64px;\n--container-max:1160px;     /* source site canvas is 980px content in a 1200px strip */\n--gutter:40px;\n--stack-tight:12px;\n--stack:24px;\n--stack-loose:40px;\n}\n\n:root{\n/* The brand is square. Nothing on the source site is rounded. */\n--radius-none:0px;\n--radius-sm:0px;\n--radius-pill:999px;        /* reserved for chips only; avoid */\n\n--border-hairline:1px;\n--border-medium:2px;\n--border-button:4px;        /* buttons carry a 4px rule */\n--border-frame:8px;         /* image / panel frame rule */\n\n/* Shadows are essentially absent. Use rules and fills instead. */\n--shadow-none:none;\n--shadow-card:0 1px 3px rgba(15,44,57,.10);\n--shadow-raised:0 6px 20px rgba(15,44,57,.14);\n\n/* Motion: the source site transitions color/background at 0.4s ease. */\n--ease:ease; /* @kind other */\n--dur-fast:200ms; /* @kind other */\n--dur:400ms; /* @kind other */\n--transition-color:color var(--dur) var(--ease),background-color var(--dur) var(--ease),border-color var(--dur) var(--ease); /* @kind other */\n}\n\nbody{margin:0;font-family:var(--font-sans);font-weight:var(--fw-light);font-size:var(--fs-body);line-height:var(--lh-snug);color:var(--text-body);background:var(--surface-page);-webkit-font-smoothing:antialiased}\na{color:var(--text-link);text-decoration:none;transition:var(--transition-color)}\na:hover{color:var(--text-link-hover);text-decoration:underline}\nh1,h2,h3,h4,h5{margin:0;font-family:var(--font-display);font-weight:var(--fw-bold);color:var(--text-heading);text-transform:var(--tt-display);letter-spacing:var(--ls-display);line-height:var(--lh-heading)}\np{margin:0 0 var(--stack-tight)}\n\n<\u002Fstyle>\n  <script src=\"ffb36745-1225-4a84-9417-e5fcf4d74818\"><\u002Fscript>\n  <style>\n    body{margin:0;background:var(--surface-page);}\n    a{color:var(--text-link);transition:color 0.4s ease;}\n    a:hover{color:var(--text-link-hover);}\n    a:focus-visible{outline:2px solid var(--igs-blue);outline-offset:2px;}\n    @media(max-width:720px){\n      #contract dl{grid-template-columns:1fr !important;}\n      #contract dl dt{border-bottom:none !important;padding-bottom:4px !important;}\n      #quotes-grid{grid-template-columns:1fr !important;}\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:var(--font-sans);color:var(--text-body);background:var(--surface-page);\">\n  <a href=\"#main\" style=\"position:absolute;left:-9999px;background:var(--igs-blue);color:#FFFFFF;padding:10px 18px;font-size:14px;\" style-focus=\"left:8px;top:8px;z-index:50;\">Skip to main content<\u002Fa>\n\n  <header style=\"border-bottom:1px solid var(--igs-gray-100);background:var(--igs-white);\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:22px clamp(20px,5vw,40px);display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;\">\n      <a href=\"https://www.initiatesolutions.com/\" style=\"display:block;\"><img src=\"84575c89-b08c-456e-a0d7-17af8a296fe9\" alt=\"Initiate Government Solutions — Building Solid Foundations\" style=\"height:58px;display:block;\"><\u002Fa>\n      <nav aria-label=\"Page sections\" style=\"display:flex;gap:26px;flex-wrap:wrap;\">\n        <a href=\"#contract\" style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;color:var(--igs-ink-700);\" style-hover=\"color:var(--igs-blue);\">Contract<\u002Fa>\n        <a href=\"#fair-opportunity\" style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;color:var(--igs-ink-700);\" style-hover=\"color:var(--igs-blue);\">Fair Opportunity<\u002Fa>\n        <a href=\"#ordering-guide\" style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;color:var(--igs-ink-700);\" style-hover=\"color:var(--igs-blue);\">Ordering Guide<\u002Fa>\n        <a href=\"#quotes\" style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;color:var(--igs-ink-700);\" style-hover=\"color:var(--igs-blue);\">Quotes<\u002Fa>\n        <a href=\"#support\" style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;color:var(--igs-ink-700);\" style-hover=\"color:var(--igs-blue);\">Support<\u002Fa>\n        <a href=\"#program-office\" style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;color:var(--igs-ink-700);\" style-hover=\"color:var(--igs-blue);\">Program Office<\u002Fa>\n        <a href=\"#resources\" style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;color:var(--igs-ink-700);\" style-hover=\"color:var(--igs-blue);\">Resources<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main id=\"main\">\n    <section aria-labelledby=\"hero-heading\" style=\"background:var(--igs-white);padding:96px clamp(20px,5vw,40px) 72px;\">\n      <div style=\"max-width:980px;margin:0 auto;text-align:center;\">\n        <p style=\"margin:0 0 26px;font-size:12px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--igs-blue);\">Initiate Government Solutions, LLC® — NASA SEWP VI Contract Holder<\u002Fp>\n        <div id=\"hero-heading\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.SectionHeading\" first=\"SEWP\" second=\"VI\" size=\"xl\" align=\"center\" hint-size=\"100%,70px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <p style=\"max-width:760px;margin:34px auto 0;font-size:var(--fs-body-lg);font-weight:300;line-height:var(--lh-body);text-align:center;\">Solutions for Enterprise-Wide Procurement (SEWP) VI is a multi-award Government-Wide Acquisition Contract (GWAC) administered by the NASA SEWP Program Management Office. Initiate Government Solutions holds a SEWP VI contract in Category&nbsp;C — ITC/AV Mission-Based Services.<\u002Fp>\n        <div style=\"display:flex;justify-content:center;gap:14px;margin:36px 0 0;flex-wrap:wrap;\">\n          <div style=\"border:1px solid var(--igs-blue);padding:12px 26px;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--igs-ink-700);\">Contract No. <strong style=\"font-weight:700;color:var(--igs-blue);\">80TECH26D0724<\u002Fstrong><\u002Fdiv>\n          <div style=\"border:1px solid var(--igs-blue);padding:12px 26px;font-size:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--igs-ink-700);\">Category <strong style=\"font-weight:700;color:var(--igs-blue);\">C<\u002Fstrong> · NAICS <strong style=\"font-weight:700;color:var(--igs-blue);\">541512<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:center;gap:20px;margin:44px 0 0;flex-wrap:wrap;\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.Button\" href=\"{{ guideUrl }}\" variant=\"solid\" size=\"lg\" hint-size=\"280px,56px\">Download Ordering Guide<\u002Fx-import>\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.Button\" href=\"https://www.sewp.nasa.gov/\" variant=\"primary\" size=\"lg\" hint-size=\"220px,56px\">NASA SEWP Home Page<\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:center;align-items:center;gap:36px;margin:56px 0 0;\">\n          <a href=\"https://www.sewp.nasa.gov/\" aria-label=\"NASA SEWP VI program information\"><img src=\"279a6b9f-993e-4af3-9af9-beed7ad1ec67\" alt=\"NASA SEWP VI Contract Holder\" style=\"height:110px;display:block;\"><\u002Fa>\n          <img src=\"f1509f8d-37df-4035-a6da-f37a99ee29b4\" alt=\"Woman-Owned Small Business certified\" style=\"height:76px;display:block;\">\n          <img src=\"6dddb2e0-cf08-4a61-ae37-a17c35faa29a\" alt=\"ISO 9001:2015 certified\" style=\"height:76px;display:block;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"contract\" aria-labelledby=\"contract-heading\" style=\"background:var(--surface-alt);padding:88px clamp(20px,5vw,40px);\">\n      <div style=\"max-width:980px;margin:0 auto;\">\n        <div id=\"contract-heading\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.SectionHeading\" first=\"Contract\" second=\"Overview\" align=\"center\" rule=\"{{ true }}\" hint-size=\"100%,90px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <dl style=\"margin:56px 0 0;border:1px solid var(--igs-gray-200);background:var(--igs-white);display:grid;grid-template-columns:minmax(180px,280px) 1fr;\">\n          <dt style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);\">Contract Vehicle<\u002Fdt>\n          <dd style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:var(--fs-body-sm);font-weight:300;\">NASA Solutions for Enterprise-Wide Procurement (SEWP) VI — a multi-award Government-Wide Acquisition Contract (GWAC)<\u002Fdd>\n          <dt style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);\">Contract Number<\u002Fdt>\n          <dd style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:var(--fs-body-sm);font-weight:300;\">80TECH26D0724<\u002Fdd>\n          <dt style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);\">Category<\u002Fdt>\n          <dd style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:var(--fs-body-sm);font-weight:300;\">Category C — ITC/AV Mission-Based (Information Technology Communication and Audio Visual) Services<\u002Fdd>\n          <dt style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);\">Contract-Level NAICS<\u002Fdt>\n          <dd style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:var(--fs-body-sm);font-weight:300;\">541512 — Computer Systems Design Services<\u002Fdd>\n          <dt style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);\">Business Designations<\u002Fdt>\n          <dd style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:var(--fs-body-sm);font-weight:300;\">Small Business; Woman-Owned Small Business (WOSB). Category C is reserved for small business; by default a Category C requirement is a small business set-aside.<\u002Fdd>\n          <dt style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);\">UEI<\u002Fdt>\n          <dd style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:var(--fs-body-sm);font-weight:300;\">P3LMWYENMDY6<\u002Fdd>\n          <dt style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);\">CAGE Code<\u002Fdt>\n          <dd style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:var(--fs-body-sm);font-weight:300;\">524M1<\u002Fdd>\n          <dt style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);\">Period of Performance<\u002Fdt>\n          <dd style=\"margin:0;padding:18px 28px;border-bottom:1px solid var(--igs-gray-100);font-size:var(--fs-body-sm);font-weight:300;\">November 1, 2026 – October 31, 2036<\u002Fdd>\n          <dt style=\"margin:0;padding:18px 28px;font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);\">Agency Handling Fee<\u002Fdt>\n          <dd style=\"margin:0;padding:18px 28px;font-size:var(--fs-body-sm);font-weight:300;\">An Agency Administrative Handling Fee, not to exceed 0.34% of the total order price, applies to all orders under the SEWP VI contracts. The current percentage is posted at <a href=\"https://www.sewp.nasa.gov/\">sewp.nasa.gov<\u002Fa>.<\u002Fdd>\n        <\u002Fdl>\n        <h3 style=\"margin:64px 0 0;font-family:var(--font-display);font-size:var(--fs-h5);font-weight:700;letter-spacing:var(--ls-display);text-transform:uppercase;color:var(--igs-ink);\">Category C Scope<\u002Fh3>\n        <div style=\"width:64px;height:2px;background:var(--igs-blue);margin:18px 0 26px;\"><\u002Fdiv>\n        <p style=\"margin:0;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);text-align:justify;\">Category C provides Federal agencies with customized solutions at a mission and program level that improve and enhance an ITC/AV infrastructure. All ITC/AV services that meet the definition and provide a mission-based solution are within scope, including custom computer programming services, telecommunication services including network operations, and ITC/AV based engineering services. Ancillary products are limited to supporting a mission-based services requirement.<\u002Fp>\n        <p style=\"margin:22px 0 0;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);text-align:justify;\">Per contract section A.1.2, Category C has a threshold restriction of $2 million per order (inclusive of options) for the first year of contract performance and $10 million per order in the second year of contract performance.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"fair-opportunity\" aria-labelledby=\"fo-heading\" style=\"background:var(--igs-white);padding:88px clamp(20px,5vw,40px);\">\n      <div style=\"max-width:980px;margin:0 auto;\">\n        <div id=\"fo-heading\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.SectionHeading\" first=\"Fair\" second=\"Opportunity\" align=\"center\" rule=\"{{ true }}\" hint-size=\"100%,90px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <p style=\"max-width:820px;margin:56px auto 0;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);text-align:justify;\">This contract is one of multiple contracts awarded under SEWP VI, a multi-award Government-Wide Acquisition Contract. No single SEWP VI contract holds exclusive rights to provide any given technology or service, and ordering agencies are not confined in their choice of contracts. As stated in the SEWP VI Statement of Work:<\u002Fp>\n        <blockquote style=\"max-width:820px;margin:32px auto 0;border:1px solid var(--igs-blue);padding:32px 40px;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);color:var(--igs-ink-700);\">“No single contract will have exclusive rights to provide any given technology or service, nor will end-users be confined in the choice of contracts they utilize. The end-users decisions will be based on a Best Value and Fair Opportunity determination as required in FAR 16.505(b).”<footer style=\"margin:16px 0 0;font-size:var(--fs-caption);color:var(--text-muted);\">— SEWP VI Statement of Work, Section A.1<\u002Ffooter><\u002Fblockquote>\n        <p style=\"max-width:820px;margin:32px auto 0;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);text-align:justify;\">Fair opportunity, including sole source determinations, is made by the ordering agency in accordance with <a href=\"https://www.acquisition.gov/far/16.505\">FAR 16.505<\u002Fa>.<\u002Fp>\n        <div style=\"max-width:820px;margin:40px auto 0;background:var(--igs-blue-100);border:1px solid var(--igs-blue);padding:28px 32px;\">\n          <p style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--igs-blue-800);\">Placeholder — pending conformed contract<\u002Fp>\n          <p style=\"margin:12px 0 0;font-size:var(--fs-body-sm);font-weight:300;line-height:var(--lh-body);color:var(--igs-ink-700);\">[The verbatim Fair Opportunity Clause from the body of Contract 80TECH26D0724 will be posted here upon receipt of the conformed contract document.]<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"ordering-guide\" aria-labelledby=\"og-heading\" style=\"background:var(--igs-white);padding:88px clamp(20px,5vw,40px);\">\n      <div style=\"max-width:980px;margin:0 auto;text-align:center;\">\n        <div id=\"og-heading\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.SectionHeading\" first=\"Ordering\" second=\"Guide\" align=\"center\" rule=\"{{ true }}\" hint-size=\"100%,90px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <p style=\"max-width:760px;margin:48px auto 0;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);text-align:justify;\">The Initiate Government Solutions SEWP VI Ordering Guide is a soft-copy document suitable for downloading and printing by SEWP customers. It contains program support information, quoting and ordering procedures, post-delivery support policies with named points of contact, and overview information about Initiate Government Solutions and the SEWP contracts. Updated versions are posted no later than 10 business days following each contract modification.<\u002Fp>\n        <div style=\"margin:40px 0 0;display:flex;justify-content:center;\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.Button\" href=\"{{ guideUrl }}\" variant=\"solid\" size=\"lg\" hint-size=\"320px,56px\">Download Ordering Guide (PDF)<\u002Fx-import>\n        <\u002Fdiv>\n        <p style=\"margin:22px 0 0;font-size:var(--fs-caption);color:var(--igs-ink-700);\">[Placeholder — the Ordering Guide PDF will be linked here and made available prior to placement of the first delivery order. Current version and date will be listed with the link.]<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"quotes\" aria-labelledby=\"quotes-heading\" style=\"background:var(--igs-white);padding:88px clamp(20px,5vw,40px);\">\n      <div style=\"max-width:980px;margin:0 auto;\">\n        <div id=\"quotes-heading\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.SectionHeading\" first=\"Obtaining\" second=\"Quotes\" align=\"center\" rule=\"{{ true }}\" hint-size=\"100%,90px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <div id=\"quotes-grid\" style=\"display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:56px;align-items:center;margin:56px 0 0;\">\n          <img src=\"3842b12f-800a-4a1a-af8e-8dfd6fe8079e\" alt=\"Initiate Government Solutions team members collaborating in an office\" style=\"width:100%;display:block;border:8px solid var(--igs-blue);box-sizing:border-box;\">\n          <div>\n            <ol style=\"margin:0;padding:0 0 0 22px;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);display:grid;gap:16px;\">\n              <li>Government customers submit Requests for Information (RFI), Market Research Requests (MRR), and Requests for Quote (RFQ) for hardware, software, or services through the NASA SEWP Quote Request Tool (QRT) at <a href=\"https://www.sewp.nasa.gov/\">sewp.nasa.gov<\u002Fa>.<\u002Fli>\n              <li>Quotes for Category C requirements issued to Initiate Government Solutions are returned through the SEWP QRT process.<\u002Fli>\n              <li>Questions regarding a quote, capabilities, or an active requirement may be directed to the sales representatives listed below.<\u002Fli>\n              <li>Customers unfamiliar with the SEWP program may contact the SEWP PMO at <a href=\"mailto:help@sewp.nasa.gov\">help@sewp.nasa.gov<\u002Fa> for guidance and training.<\u002Fli>\n            <\u002Fol>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;margin:48px 0 0;\">\n          <div style=\"border:1px solid var(--igs-blue);padding:28px 32px;\">\n            <p style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--igs-blue);\">Sales Representative — Quotes<\u002Fp>\n            <p style=\"margin:14px 0 0;font-size:var(--fs-body);font-weight:600;color:var(--text-muted);\">[Name placeholder]<\u002Fp>\n            <p style=\"margin:8px 0 0;font-size:var(--fs-body-sm);font-weight:300;color:var(--text-muted);\">[Telephone placeholder]<br>[Email address placeholder]<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--igs-blue);padding:28px 32px;\">\n            <p style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--igs-blue);\">Sales Representative — Quotes<\u002Fp>\n            <p style=\"margin:14px 0 0;font-size:var(--fs-body);font-weight:600;color:var(--text-muted);\">[Name placeholder]<\u002Fp>\n            <p style=\"margin:8px 0 0;font-size:var(--fs-body-sm);font-weight:300;color:var(--text-muted);\">[Telephone placeholder]<br>[Email address placeholder]<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"support\" aria-labelledby=\"support-heading\" style=\"background:var(--surface-alt);padding:88px clamp(20px,5vw,40px);\">\n      <div style=\"max-width:980px;margin:0 auto;\">\n        <div id=\"support-heading\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.SectionHeading\" first=\"Customer\" second=\"Support\" align=\"center\" rule=\"{{ true }}\" hint-size=\"100%,90px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <p style=\"max-width:820px;margin:48px auto 0;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);text-align:justify;\">Policy and procedural information for each post-delivery support area is provided below. The Ordering Guide contains the full text of each policy.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;margin:44px 0 0;\">\n          <div style=\"background:var(--igs-white);border:1px solid var(--igs-gray-200);padding:26px 28px;\">\n            <h3 style=\"margin:0;font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--igs-ink);\">Installation<\u002Fh3>\n            <p style=\"margin:14px 0 0;font-size:var(--fs-caption);font-weight:300;line-height:var(--lh-body);color:var(--text-muted);\">[Installation policy and procedural information placeholder]<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--igs-white);border:1px solid var(--igs-gray-200);padding:26px 28px;\">\n            <h3 style=\"margin:0;font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--igs-ink);\">Basic Warranty<\u002Fh3>\n            <p style=\"margin:14px 0 0;font-size:var(--fs-caption);font-weight:300;line-height:var(--lh-body);color:var(--text-muted);\">[Basic warranty policy and procedural information placeholder]<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--igs-white);border:1px solid var(--igs-gray-200);padding:26px 28px;\">\n            <h3 style=\"margin:0;font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--igs-ink);\">Extended Warranty<\u002Fh3>\n            <p style=\"margin:14px 0 0;font-size:var(--fs-caption);font-weight:300;line-height:var(--lh-body);color:var(--text-muted);\">[Extended warranty policy and procedural information placeholder]<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--igs-white);border:1px solid var(--igs-gray-200);padding:26px 28px;\">\n            <h3 style=\"margin:0;font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--igs-ink);\">Technical Support<\u002Fh3>\n            <p style=\"margin:14px 0 0;font-size:var(--fs-caption);font-weight:300;line-height:var(--lh-body);color:var(--text-muted);\">[Technical support policy and procedural information placeholder]<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--igs-white);border:1px solid var(--igs-gray-200);padding:26px 28px;\">\n            <h3 style=\"margin:0;font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--igs-ink);\">Software Support<\u002Fh3>\n            <p style=\"margin:14px 0 0;font-size:var(--fs-caption);font-weight:300;line-height:var(--lh-body);color:var(--text-muted);\">[Software support policy and procedural information placeholder]<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--igs-white);border:1px solid var(--igs-gray-200);padding:26px 28px;\">\n            <h3 style=\"margin:0;font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--igs-ink);\">Post-Delivery Issues<\u002Fh3>\n            <p style=\"margin:14px 0 0;font-size:var(--fs-caption);font-weight:300;line-height:var(--lh-body);color:var(--text-muted);\">[Other post-delivery policy and procedural information placeholder]<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin:44px 0 0;border:1px solid var(--igs-blue);background:var(--igs-white);padding:28px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;\">\n          <div>\n            <p style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--igs-blue);\">Support Staff — Warranty &amp; Technical<\u002Fp>\n            <p style=\"margin:14px 0 0;font-size:var(--fs-body);font-weight:600;color:var(--text-muted);\">[Name placeholder]<\u002Fp>\n            <p style=\"margin:8px 0 0;font-size:var(--fs-body-sm);font-weight:300;color:var(--text-muted);\">[Telephone placeholder]<br>[Email address placeholder]<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--igs-blue);\">Support Staff — Software &amp; Post-Delivery<\u002Fp>\n            <p style=\"margin:14px 0 0;font-size:var(--fs-body);font-weight:600;color:var(--text-muted);\">[Name placeholder]<\u002Fp>\n            <p style=\"margin:8px 0 0;font-size:var(--fs-body-sm);font-weight:300;color:var(--text-muted);\">[Telephone placeholder]<br>[Email address placeholder]<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"margin:72px 0 0;font-family:var(--font-display);font-size:var(--fs-h5);font-weight:700;letter-spacing:var(--ls-display);text-transform:uppercase;color:var(--igs-ink);text-align:center;\">Troubleshooting an Order<\u002Fh3>\n        <div style=\"width:64px;height:2px;background:var(--igs-blue);margin:18px auto 0;\"><\u002Fdiv>\n        <ol style=\"max-width:820px;margin:32px auto 0;padding:0 0 0 22px;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);display:grid;gap:14px;\">\n          <li>Contact the order support staff listed below with the SEWP order number, delivery order number, and a description of the issue.<\u002Fli>\n          <li>Unresolved issues are escalated to the Initiate Government Solutions SEWP VI Program Manager, listed in the Program Office section of this page.<\u002Fli>\n          <li>The NASA SEWP PMO provides front-line order support to customers, including problem determination, escalation, and resolution, at <a href=\"mailto:help@sewp.nasa.gov\">help@sewp.nasa.gov<\u002Fa>.<\u002Fli>\n        <\u002Fol>\n        <div style=\"max-width:820px;margin:36px auto 0;border:1px solid var(--igs-blue);background:var(--igs-white);padding:28px 32px;\">\n          <p style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--igs-blue);\">Support Staff — Order Troubleshooting<\u002Fp>\n          <p style=\"margin:14px 0 0;font-size:var(--fs-body);font-weight:600;color:var(--text-muted);\">[Name placeholder]<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:var(--fs-body-sm);font-weight:300;color:var(--text-muted);\">[Telephone placeholder]<br>[Email address placeholder]<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"program-office\" aria-labelledby=\"po-heading\" style=\"background:var(--igs-white);padding:88px clamp(20px,5vw,40px);\">\n      <div style=\"max-width:980px;margin:0 auto;\">\n        <div id=\"po-heading\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.SectionHeading\" first=\"Program\" second=\"Office\" align=\"center\" rule=\"{{ true }}\" hint-size=\"100%,90px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <p style=\"max-width:820px;margin:48px auto 0;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);text-align:justify;\">The Initiate Government Solutions SEWP Program Office facilitates communications, electronic reports, order processing and troubleshooting, customer support services, and contract modifications. The Program Manager serves as the main point of contact between Initiate Government Solutions and the SEWP PMO. Program Manager and Deputy Program Manager contact information is also maintained on the SEWP home website.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;margin:44px 0 0;\">\n          <div style=\"border:1px solid var(--igs-blue);padding:32px 36px;\">\n            <p style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--igs-blue);\">Program Manager<\u002Fp>\n            <p style=\"margin:16px 0 0;font-size:var(--fs-h5);font-weight:600;color:var(--text-muted);\">[Name placeholder]<\u002Fp>\n            <p style=\"margin:10px 0 0;font-size:var(--fs-body-sm);font-weight:300;line-height:var(--lh-body);color:var(--text-muted);\">[Telephone placeholder]<br>[Email address placeholder]<br>[Mailing address placeholder]<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--igs-blue);padding:32px 36px;\">\n            <p style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--igs-blue);\">Deputy Program Manager<\u002Fp>\n            <p style=\"margin:16px 0 0;font-size:var(--fs-h5);font-weight:600;color:var(--text-muted);\">[Name placeholder]<\u002Fp>\n            <p style=\"margin:10px 0 0;font-size:var(--fs-body-sm);font-weight:300;line-height:var(--lh-body);color:var(--text-muted);\">[Telephone placeholder]<br>[Email address placeholder]<br>[Mailing address placeholder]<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"resources\" aria-labelledby=\"res-heading\" style=\"background:var(--surface-alt);padding:88px clamp(20px,5vw,40px);\">\n      <div style=\"max-width:980px;margin:0 auto;\">\n        <div id=\"res-heading\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.SectionHeading\" first=\"Related\" second=\"Resources\" align=\"center\" rule=\"{{ true }}\" hint-size=\"100%,90px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <ul style=\"max-width:640px;margin:48px auto 0;padding:0;list-style:none;display:grid;gap:0;border:1px solid var(--igs-gray-200);background:var(--igs-white);\">\n          <li style=\"border-bottom:1px solid var(--igs-gray-100);\"><a href=\"https://www.sewp.nasa.gov/\" style=\"display:block;padding:18px 28px;font-size:var(--fs-body-sm);font-weight:600;text-decoration:none;\">NASA SEWP Home Page <span style=\"display:block;margin-top:4px;font-size:var(--fs-caption);font-weight:300;color:var(--text-muted);\">sewp.nasa.gov — program information, Quote Request Tool, and training<\u002Fspan><\u002Fa><\u002Fli>\n          <li style=\"border-bottom:1px solid var(--igs-gray-100);\"><a href=\"https://www.sewp.nasa.gov/sewpvi/\" style=\"display:block;padding:18px 28px;font-size:var(--fs-body-sm);font-weight:600;text-decoration:none;\">SEWP VI Program Information <span style=\"display:block;margin-top:4px;font-size:var(--fs-caption);font-weight:300;color:var(--text-muted);\">sewp.nasa.gov/sewpvi — SEWP VI documents and updates<\u002Fspan><\u002Fa><\u002Fli>\n          <li style=\"border-bottom:1px solid var(--igs-gray-100);\"><a href=\"https://www.initiatesolutions.com/\" style=\"display:block;padding:18px 28px;font-size:var(--fs-body-sm);font-weight:600;text-decoration:none;\">Initiate Government Solutions <span style=\"display:block;margin-top:4px;font-size:var(--fs-caption);font-weight:300;color:var(--text-muted);\">initiatesolutions.com — corporate home page, capabilities, and contract vehicles<\u002Fspan><\u002Fa><\u002Fli>\n          <li style=\"border-bottom:1px solid var(--igs-gray-100);\"><a href=\"https://www.acquisition.gov/far/16.505\" style=\"display:block;padding:18px 28px;font-size:var(--fs-body-sm);font-weight:600;text-decoration:none;\">FAR 16.505 — Ordering <span style=\"display:block;margin-top:4px;font-size:var(--fs-caption);font-weight:300;color:var(--text-muted);\">acquisition.gov — fair opportunity ordering procedures<\u002Fspan><\u002Fa><\u002Fli>\n          <li><a href=\"https://sam.gov/entities/view/P3LMWYENMDY6/coreData?status=Active&amp;emrKeyValue=2132800~1781277104507059&amp;regId=17722555\" style=\"display:block;padding:18px 28px;font-size:var(--fs-body-sm);font-weight:600;text-decoration:none;\">SAM.gov Entity Registration <span style=\"display:block;margin-top:4px;font-size:var(--fs-caption);font-weight:300;color:var(--text-muted);\">sam.gov — entity registration for Initiate Government Solutions, LLC (UEI P3LMWYENMDY6, CAGE 524M1)<\u002Fspan><\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section aria-labelledby=\"a11y-heading\" style=\"background:var(--surface-brand);padding:80px clamp(20px,5vw,40px);\">\n      <div style=\"max-width:820px;margin:0 auto;text-align:center;\">\n        <div id=\"a11y-heading\">\n          <x-import component-from-global-scope=\"IGSDesignSystem_421541.SectionHeading\" first=\"Section\" second=\"508\" tone=\"dark\" align=\"center\" hint-size=\"100%,60px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <p style=\"margin:36px 0 0;font-size:var(--fs-body);font-weight:300;line-height:var(--lh-body);color:var(--igs-white);text-align:justify;\">Initiate Government Solutions maintains this page and its downloadable documents in compliance with applicable Government access standards for electronic and information technology, including standards based on Section 508 of the Rehabilitation Act Amendments. Requests for documents in an alternative format, or reports of an accessibility issue on this page, may be directed to <a href=\"mailto:info@initiatesolutions.com\" style=\"color:var(--igs-white);text-decoration:underline;\">info@initiatesolutions.com<\u002Fa> or 866-771-8931.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <x-import component-from-global-scope=\"IGSDesignSystem_421541.SiteFooter\" naics=\"{{ footerNaics }}\" uei=\"P3LMWYENMDY6\" gsa=\"GS-35F-139DA\" phone=\"866-771-8931\" email=\"info@initiatesolutions.com\" copyright=\"© 2007-2026 Initiate Government Solutions®\" hint-size=\"100%,320px\"><\u002Fx-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;contractNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;[Contract number placeholder]&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contract data&quot;},&quot;orderingGuideUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#ordering-guide&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contract data&quot;}}\">\nclass Compo
